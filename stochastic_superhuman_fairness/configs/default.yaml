# =========================
# General experiment settings
# =========================
seed: 42
device: cuda
exp_name: # If none, this is the dataset name used: adult or compas
exp_tag: # This appended to the exp name for further customization
log_dir: './runs'

global:
  eval_freq: 5     # global fallback for evaluation frequency

     # strings of variables to not record during training, by default gamma_matrix     
# =========================
# Fairness metric selection
# =========================
metrics:
  use: ["D.DP", "D.EqOdds", "D.PRP", "D.Err", "L.ZeroOne"]
  use_demos_as_gruth: False

# =========================
# Subdominance configuration
# =========================
subdominance:
  # type: bayesian  # standard | stochastic
  mode: kernel # absolute, relative, kernel
  feature_based_subdom: False # only affects intra demo subdom and selection
  kernel_power: 2
  feat_reduce: sum # sum, mean, max, l2. How the feature dims are combined to generate subdom, per rollout
  rollout_aggregate: sum # How
  alpha: [1.,1.,1.,2.,30.] # Alpha defaults to 1. Alpha/beta scalars are broadcasted
  beta: 0.00 # If null defaults to 0
  adaptive_beta: false
  weight_mode: simple # simple, softmax, linear
  alpha_updates: static  #analytical, static
  alpha_reduce: 'mean'   #mean, None, median

# =========================
# Demonstrator configuration
# =========================
demonstrator:
  dataset: "adult" # adult or compas
  shared_x: True
  demotype: lrdecisions  # partition or lrdecisions
  # LR (Logistic Regression) Decisions Specific
  n_models: 100 # only used with lr decisions. How many classifier are trained. One per demo.
  subset_ratio: 0.1 # subset of training data that lr classifiers are trained on, but provide pred to entire train set. (both train and eval cases)
  # Data Partition Specific
  demo_size: 100  # ingored with lr decisions, only used for partitions
  # General
  compute_global: true
  join_train_eval: False # This can only work if train and eval are formed from equally sized datasets: train_ratio = 0.5
  only_select_demos:    # a list of demo idxs to select. Idxs are the ranking order according to selection_metric
  get_top_k:  1. # if not None, should be float in [0,1]. it is overrided by only_select_demos functionality if not none.
  demo_selection_metric: 'pareto_frontier_clean' # beat_rate, subdom, pareto_frontier +clean, nondominated
  close_tol : 0.02     #tolerance before which points are removed even if on the frontier, for cleaner frontier
  normalize: True # Constraint values
  normalize_mode: 'continuous'
  overwrite: False # True/ False. True will force regenerate the demos, even if they exist
  cache_dir: "./data"
  metrics: ["D.DP", "D.EqOdds", "D.PRP", "D.Err", "L.ZeroOne"] # Default list; overwritten by metrics above
  train_ratio: 0.8 # amount of data exclusively in training set split. This then forms train_demos and eval_demos
  protected_attrs:          # these are attributes are ommited from the the features
  sensitive_attrs: ['sex']  # these are the attributes  that fairness is measured on
  save_format: "zip" # zip or npy. with npy a separate json metadata file is saved at data folder
  demo_sample: null
  # Set to true to construct diagnostic set with 50% demos 50% RANDOM DECISIONS
  use_diagnostic_train: False # semi_random, pareto_clean, False, None
  use_diagnostic_eval: False  # semi_random, pareto_clean, False, None

# =========================
# Learner configuration
# =========================
learner:
  logging:
    no_record: #[gamma_matrix]

  schedule:
    - algo: subdominantLogistic #subdominantLogistic, subdominantmlp
      epochs: 2000
      eval_freq: 2
      train_print_freq: 100
      model_cfg:
        post_eval_transfer: False

        # policy_sources: ['random', 'logistic_model_adult_performance_0p1884_0p1289_0p0559_0p0903_0p1419.pkl']
        # policy_sources: ['logistic_model_adult_performance_0p1884_0p1289_0p0559_0p0903_0p1419.pkl']
        # policy_sources: ['logistic_model_adultpoor_performance_0p2638_0p1222_0p1846_0p0681_0p4236.pkl']
        # policy_sources: ['logistic_model_adult_performance_0p1884_0p1289_0p0559_0p0903_0p1419.pkl', 'logistic_model_adultpoor_performance_0p2638_0p1222_0p1846_0p0681_0p4236.pkl']
        policy_sources: ['random']
        policy_mixture: [1.]
        n_models: 8
        init_noise_std: 1.2
      train:
        lr: 0.003
        batch_size: 100
        n_rollouts: 10
        t_function: 'vec' # old, ref, vec, collect
        n_mini_epochs: 2
        stochastic:
        
    # - algo: bayesianLogistic
    #   epochs: 100
    #   eval_freq: 4
    #   model_cfg:
    #     policy:
    #   train:
    #     lr: 0.001
    #     batch_size: 100
    #     bayesian:
    #       dist_mode: 'full_param_mvn'
    #       ema: 1.0
    #       max_mean_delta:
    #       var_ratio_clip: #[0.1, 10.0]

  # Each Phase will have the default values if non are given. When a kwarg is None above it stays None. 
  default:
    model_cfg:
    epochs: 10
    train:
      lr: 1e-3
      batch_size: 32
      optimizer: 'adam' # adam, sgd
      stochastic:
        solver: 'mosek' # mosek, sinkhorn, mip_mosek
        decision_threshold:  # set to None for stochastic (Bernoulli sampling) training rollouts
        weighted_S_matrix: False
        # indicator_func: 'soft_median_intrademo_subdom' # median, mean, NOne, median_intrademo_subdom, match_sum | soft_ adds sigmoid smoothing to indicators instead ob binary [0,1]
        indicator_func: 'median_intrademo_subdom' # median, mean, NOne, median_intrademo_subdom, match_sum | soft_ adds sigmoid smoothing to indicators instead ob binary [0,1]
        gamma_temperature: 1.0 # Can be used to sharpen gamma matrix after we get it from OT solver
        sparse_gamma: False # Keeps only the max for each row (rollout) as 1 zeros out the rest
        renormalize_gamma: False
        compute_intrademo_ot_loss: True
        gamma_commit_freq: 1 # if greaterthan 1, set amount of epochs gamma stays fixed
        adaptive_ema: True # if True, policies whose mean-S hasn't improved over plateau_window use stuck_ema instead of gamma_smoothing_ema
        plateau_window: 20 # epochs of mean-S history used to detect a stuck policy
        plateau_tol: 0.02 # relative improvement over plateau_window below which a policy is flagged stuck
        stuck_ema: 0.3 # ema applied to stuck policies' gamma rows (lower = forgets a stale/unwinnable match faster)
        coupling_cfg:
          row_constraints: 'policy_budget'      # True, False, policy_budget
          col_constraints: 'ranking' #'rev_ranking' # Options : None(uniform), rev_ranking, ranking, policy_probs
          S_tau: 1.0        # can be used to sharpen subdom matrix S before ot
          normalize_s_matrix: False
          gamma_smoothing_ema: 0.8 # Controls impact of t-1 epoch's gamma. None for no temporal smoothing or ema~[0,1]

        loss_fn: 'weighted' #  weighted, bc_guided
        loss_fn_kwargs: #for nested  dict be sure to include them into no_flatten_terms in line 88 base_model.py
          term_weights: [1., 1.]
          bc_lambda: 0.2
          lambda_direct: 0.9 # weight of direct soft subdom term if direct loss is used
      bayesian:
        n_rollouts: 256
        dist_mode: 'per_param_diag' # per_param_diag | per_layer_neuron_mvn | global_neuron_mvn
        ema : 0.2
        var_floor: 1e-8  
        cov_floor: 1e-5  
        shrinkage: 0.2
